name: build-fbneo-rollback

# 手动触发：仓库 Actions 页面点 "Run workflow"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkgconf python3 zip \
            p7zip-full libsdl2-dev jq wget curl gpg

      - name: Build patched cores
        run: |
          EJS_CORE=fbneo EJS_CORE_REPO=https://github.com/libretro/fbneo EJS_CORE_BRANCH=master \
            bash tools/rollback/build-fbneo-rollback.sh

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-wasm-rollback
          path: tools/rollback/work/build/output/*-wasm.data
          if-no-files-found: error
